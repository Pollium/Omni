name: omni

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: omni
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: packages/apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3001"
      TZ: UTC
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      DATABASE_URL: postgres://omni:${POSTGRES_PASSWORD}@postgres:5432/omni
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${OMNI_API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: packages/apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${OMNI_PORT:-8090}:80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
