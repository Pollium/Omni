services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: omni
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: packages/apps/api/Dockerfile
    environment:
      PORT: 3001
      TZ: UTC
      LOG_LEVEL: info
      LOG_PRETTY: "false"
      DATABASE_URL: postgres://omni:${POSTGRES_PASSWORD}@postgres:5432/omni
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NAME: ${NAME}
      WEB_URL: ${WEB_URL}
      API_URL: ${API_URL}
      APPS: ${APPS}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_KEY: ${SERVICE_KEY}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      MEMBERSHIP_HOOK_URL: ${MEMBERSHIP_HOOK_URL:-}
      TERMS_URL: ${TERMS_URL:-}
      PRIVACY_URL: ${PRIVACY_URL:-}
      DEFAULT_ORGANIZATION_NAME: ${DEFAULT_ORGANIZATION_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT: ${MICROSOFT_TENANT:-common}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    ports:
      - "3001"
    depends_on:
      - postgres
      - redis

  web:
    build:
      context: .
      dockerfile: packages/apps/web/Dockerfile
    ports:
      - "80"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
